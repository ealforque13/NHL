name: Update NHL lineups roster data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: nhl-lineup-rosters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download free NHL rosters
        run: python scripts/update_lineups.py
      - name: Commit updated lineup roster JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineups/
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL roster and headshot data"
            git push
          fi
