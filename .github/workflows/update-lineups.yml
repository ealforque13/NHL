
name: Update projected NHL lineups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate lineup Python script
        run: python -m py_compile scripts/update_lineups.py

      - name: Confirm lineup updater is ready
        run: echo "Lineup script validated. Automated retrieval is not enabled."
