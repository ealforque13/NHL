
name: Update NHL data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: nhl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lineup parser dependency
        run: python -m pip install beautifulsoup4

      - name: Fetch and cache NHL data
        run: python scripts/update_data.py

      - name: Update matchup intelligence data
        run: python scripts/update_matchups.py

      - name: Update projected NHL lineups
        env:
          DAILY_FACEOFF_SCRAPING_ALLOWED: ${{ vars.DAILY_FACEOFF_SCRAPING_ALLOWED || '0' }}
        run: python scripts/update_lineups.py

      - name: Commit refreshed data
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update NHL dashboard data"

          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            git fetch origin "${BRANCH}"

            if ! git rebase "origin/${BRANCH}"; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              echo "Stopping to avoid overwriting remote changes."
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "NHL dashboard data pushed successfully."
              exit 0
            fi

            echo "Remote changed during push. Retrying..."

            sleep $((attempt * 3))
          done

          echo "ERROR: Could not push after 5 attempts."
          exit 1
