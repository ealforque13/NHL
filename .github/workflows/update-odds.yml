name: Update FanDuel odds
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: hoist-odds-refresh
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_odds.py
        env:
          FANDUEL_APP_KEY: ${{ secrets.FANDUEL_APP_KEY }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/odds.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh FanDuel odds'
          git pull --rebase
          git push
