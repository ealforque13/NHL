
name: Update NHL organizational rosters

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: nhl-organizational-rosters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install beautifulsoup4

      - name: Update organizational rosters
        run: python -u scripts/update_prospects.py

      - name: Commit cached rosters
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prospects/
          git diff --cached --quiet && exit 0
          git commit -m 'Update organizational rosters'
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
